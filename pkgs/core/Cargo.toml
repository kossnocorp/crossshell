[package]
name = "crossshell"
version = "0.0.0"
edition = "2024"
description = "Simple cross-platform shell language"
license = "MIT"
include = ["src/**", "Cargo.toml"]

[dependencies]
thiserror = "2"
ariadne = "0.6"

[dev-dependencies]
glob = "0.3"
insta = "1"
serde_json = "1"

[[bench]]
name = "parser"
harness = false
