[package]
name = "crossshell_interpreter"
version = "0.0.0"
edition = "2024"
description = "Reusable shell interpreter with bundled uutils commands"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/crossshell"

[dependencies]
anyhow = "1.0.104"
crossshell = { path = "../core", version = "0.0.0" }
glob = "0.3"
regex = "1"
os_pipe = "1"
tempfile = "3"
uucore = "0.12.0"
uu_base64 = "0.12.0"
uu_basename = "0.12.0"
uu_cat = "0.12.0"
uu_cp = "0.12.0"
uu_cut = "0.12.0"
uu_date = "0.12.0"
uu_dirname = "0.12.0"
uu_echo = "0.12.0"
uu_env = "0.12.0"
uu_false = "0.12.0"
uu_head = "0.12.0"
uu_ln = "0.12.0"
uu_ls = "0.12.0"
uu_mkdir = "0.12.0"
uu_mktemp = "0.12.0"
uu_mv = "0.12.0"
uu_paste = "0.12.0"
uu_printenv = "0.12.0"
uu_printf = "0.12.0"
uu_pwd = "0.12.0"
uu_readlink = "0.12.0"
uu_realpath = "0.12.0"
uu_rm = "0.12.0"
uu_rmdir = "0.12.0"
uu_seq = "0.12.0"
uu_sleep = "0.12.0"
uu_sort = "0.12.0"
uu_split = "0.12.0"
uu_tail = "0.12.0"
uu_tee = "0.12.0"
uu_test = "0.12.0"
uu_touch = "0.12.0"
uu_tr = "0.12.0"
uu_true = "0.12.0"
uu_truncate = "0.12.0"
uu_uname = "0.12.0"
uu_uniq = "0.12.0"
uu_wc = "0.12.0"
uu_yes = "0.12.0"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3"
libc = "0.2"
