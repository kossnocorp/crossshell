[package]
name = "cssh"
version = "0.0.0"
edition = "2024"
description = "Simple cross-platform shell language"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/crossshell"

[[bin]]
name = "cssh"
path = "src/main.rs"

[dependencies]
crossshell_interpreter = { path = "../interpreter", version = "0.0.0" }
crossshell = { path = "../core", version = "0.0.0" }
anyhow = "1.0.104"
usage = { package = "usage-rs", version = "6" }

[dev-dependencies]
tempfile = "3"
